<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="930" viewBox="0 0 1200 930">
  <style>
    @font-face { font-family: 'Cubic 11'; src: url('../../../art/fonts/Cubic_11.ttf') format('truetype'); }
    text { font-family: 'Cubic 11', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }
    image { image-rendering: pixelated; }
    rect { shape-rendering: crispEdges; }
    .ann { font-size: 11px; fill: #fff; stroke: #000; stroke-width: 3; paint-order: stroke; text-anchor: middle; }
    .annc { font-size: 12px; fill: #7FE9FF; stroke: #000; stroke-width: 3; paint-order: stroke; text-anchor: end; }
    .band { fill: #FF9F1C; fill-opacity: 0.5; stroke: #FF9F1C; stroke-width: 1; stroke-dasharray: 4 3; }
    .pan { fill: none; stroke: #00D1FF; stroke-width: 2; stroke-dasharray: 6 3; }
    .lbl { font-size: 14px; fill: #111; }
    .num { font-size: 12px; fill: #fff; stroke: #000; stroke-width: 2; paint-order: stroke; text-anchor: middle; }
  </style>
  <defs>
    <clipPath id="c800"><rect width="360" height="800"/></clipPath>

    <g id="cS"><rect width="44" height="52" fill="#2E7D4F"/><image href="../../../art/ui/event/icon_signed.png" x="10" y="22" width="24" height="24"/></g>
    <g id="cF"><rect width="44" height="52" fill="#2A2F3A"/><image href="../../../art/ui/resource/coin.png" x="10" y="22" width="25" height="25"/></g>
    <g id="cN"><use href="#cF"/><rect x="1" y="1" width="42" height="50" fill="none" stroke="#F4C430" stroke-width="2"/></g>

    <!-- 資源列 D03(y 28 起,不隨高度改變) -->
    <g id="bar">
      <rect x="8" y="28" width="64" height="44" rx="6" fill="#000" fill-opacity="0.627"/>
      <rect x="76" y="28" width="92" height="44" rx="6" fill="#000" fill-opacity="0.627"/>
      <rect x="172" y="28" width="92" height="44" rx="6" fill="#000" fill-opacity="0.627"/>
      <rect x="268" y="28" width="84" height="44" rx="6" fill="#000" fill-opacity="0.627"/>
      <image href="../../../art/ui/resource/heart.png" x="18" y="38" width="25" height="25"/>
      <image href="../../../art/ui/resource/plus_badge.png" x="31" y="51" width="12" height="12"/>
      <image href="../../../art/ui/resource/coin.png" x="86" y="38" width="25" height="25"/>
      <image href="../../../art/ui/resource/plus_badge.png" x="99" y="51" width="12" height="12"/>
      <image href="../../../art/ui/resource/gold.png" x="182" y="38" width="25" height="25"/>
      <image href="../../../art/ui/resource/plus_badge.png" x="195" y="51" width="12" height="12"/>
      <image href="../../../art/ui/resource/silver.png" x="272" y="38" width="25" height="25"/>
      <g font-size="12" fill="#fff"><text x="47" y="54">5</text><text x="115" y="54">12300</text><text x="211" y="54">50</text><text x="301" y="54">20</text></g>
    </g>
    <!-- 活動頁返回鈕 D04(y 80,不隨高度改變) -->
    <image id="back" href="../../../art/ui/home/theme-arrow_right.png" x="0" y="0" width="24" height="24" transform="translate(42,90) scale(-1,1)"/>
    <!-- banner:原點 y = banner 上緣 -->
    <g id="banner"><rect x="20" y="0" width="320" height="50" fill="#95A5A6"/><text x="180" y="30" font-size="14" text-anchor="middle" fill="#000">廣告 320×50</text></g>

    <!-- 首頁:原點 y = 該元件上緣 -->
    <g id="homeBar">
      <rect x="8" y="0" width="48" height="48" fill="#000" fill-opacity="0.627"/>
      <rect x="60" y="0" width="240" height="48" fill="#000" fill-opacity="0.627"/>
      <rect x="304" y="0" width="48" height="48" fill="#000" fill-opacity="0.627"/>
      <image href="../../../art/ui/home/theme-arrow_right.png" x="0" y="0" width="24" height="24" transform="translate(44,12) scale(-1,1)"/>
      <image href="../../../art/ui/home/theme-arrow_right.png" x="316" y="12" width="24" height="24"/>
      <text x="180" y="22" font-size="16" text-anchor="middle" fill="#fff">晴空草原</text>
      <text x="180" y="40" font-size="12" text-anchor="middle" fill="#B0B8C4">第 1~20 關</text>
    </g>
    <g id="homeMap">
      <rect x="8" y="0" width="344" height="232" rx="6" fill="#000" fill-opacity="0.627"/>
      <image href="../../../art/ui/home/level-map/tile_normal_cleared.png" x="53" y="21" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_cleared.png" x="142" y="21" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_playable.png" x="231" y="21" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="276" y="88" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="186" y="88" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="98" y="88" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="8" y="88" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="53" y="154" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_normal_locked.png" x="142" y="154" width="76" height="76"/>
      <image href="../../../art/ui/home/level-map/tile_boss_locked.png" x="231" y="154" width="76" height="76"/>
      <text class="num" x="91" y="48">1</text><text class="num" x="180" y="48">2</text><text class="num" x="269" y="48">3</text>
      <text class="num" x="314" y="115">4</text><text class="num" x="224" y="115">5</text><text class="num" x="136" y="115">6</text><text class="num" x="46" y="115">7</text>
      <text class="num" x="91" y="181">8</text><text class="num" x="180" y="181">9</text><text class="num" x="269" y="181">10</text>
    </g>
    <g id="homeStart">
      <image href="../../../art/ui/home/start-button/start_normal.png" x="72" y="0" width="216" height="80"/>
      <text x="180" y="36" font-size="20" text-anchor="middle" fill="#fff" stroke="#0B3D22" stroke-width="3" paint-order="stroke">開始</text>
      <text x="180" y="58" font-size="12" text-anchor="middle" fill="#fff" stroke="#0B3D22" stroke-width="2" paint-order="stroke">第 3 關</text>
    </g>
    <g id="homeBottom">
      <rect x="8" y="-4" width="344" height="80" rx="6" fill="#000" fill-opacity="0.627"/>
      <image href="../../../art/ui/home/bottom-button/icon_event.png" x="17" y="0" width="64" height="64"/>
      <image href="../../../art/ui/home/bottom-button/icon_shop.png" x="104" y="0" width="64" height="64"/>
      <image href="../../../art/ui/home/bottom-button/icon_growth.png" x="191" y="0" width="64" height="64"/>
      <image href="../../../art/ui/home/bottom-button/icon_settings.png" x="278" y="0" width="64" height="64"/>
      <g font-size="15" fill="#fff" stroke="#000" stroke-width="2" paint-order="stroke" text-anchor="middle">
