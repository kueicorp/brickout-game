      </g>
    </g>

    <!-- 活動頁 A 列表項目:原點 = 項目左上 -->
    <g id="itemCheck">
      <rect x="0.5" y="0.5" width="331" height="71" fill="#222B3A" stroke="#5D6D7E"/>
      <image href="../../../art/ui/event/icon_checkin.png" x="12" y="12" width="48" height="48"/>
      <circle cx="58" cy="10" r="5.5" fill="#E74C3C" stroke="#FFFFFF" stroke-width="1"/>
      <text x="72" y="32" font-size="16" fill="#fff">每日簽到</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">每日 1500 金幣 + 2 愛心</text>
      <text x="312" y="43" font-size="18" text-anchor="middle" fill="#fff">&gt;</text>
    </g>
    <g id="itemTopup">
      <rect x="0.5" y="0.5" width="331" height="71" fill="#222B3A" stroke="#5D6D7E"/>
      <image href="../../../art/ui/event/icon_first_topup.png" x="12" y="12" width="48" height="48"/>
      <text x="72" y="32" font-size="16" fill="#fff">首次儲值</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">限購 1 次</text>
      <text x="312" y="43" font-size="18" text-anchor="middle" fill="#fff">&gt;</text>
    </g>
    <g id="itemFuture">
      <rect x="0.5" y="0.5" width="331" height="71" fill="#222B3A" stroke="#8A93A3" stroke-dasharray="4 3"/>
      <rect x="12" y="12" width="48" height="48" fill="#3A4252" fill-opacity="0.6"/>
      <text x="72" y="32" font-size="16" fill="#fff">示意:未來活動</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">只是示意,內容未設計</text>
      <text x="312" y="43" font-size="18" text-anchor="middle" fill="#fff">&gt;</text>
    </g>

    <!-- 活動頁 B:摘要(原點 y = 摘要上緣)、28 格(原點 y = 格子上緣)、累積卡(原點 y = 卡上緣) -->
    <g id="sumB">
      <text x="14" y="18" font-size="14" fill="#fff">本月已簽 7 / 28 次</text>
      <text x="14" y="36" font-size="12" fill="#fff">每日 1500 金幣 + 2 愛心</text>
      <rect x="250" y="0" width="96" height="44" fill="#2ECC71"/>
      <text x="298" y="27" font-size="14" text-anchor="middle" fill="#000">今日簽到</text>
    </g>
    <g id="gridB">
      <use href="#cS" x="14" y="0"/><use href="#cS" x="62" y="0"/><use href="#cS" x="110" y="0"/><use href="#cS" x="158" y="0"/><use href="#cS" x="206" y="0"/><use href="#cS" x="254" y="0"/><use href="#cS" x="302" y="0"/>
      <use href="#cN" x="14" y="56"/><use href="#cF" x="62" y="56"/><use href="#cF" x="110" y="56"/><use href="#cF" x="158" y="56"/><use href="#cF" x="206" y="56"/><use href="#cF" x="254" y="56"/><use href="#cF" x="302" y="56"/>
      <use href="#cF" x="14" y="112"/><use href="#cF" x="62" y="112"/><use href="#cF" x="110" y="112"/><use href="#cF" x="158" y="112"/><use href="#cF" x="206" y="112"/><use href="#cF" x="254" y="112"/><use href="#cF" x="302" y="112"/>
      <use href="#cF" x="14" y="168"/><use href="#cF" x="62" y="168"/><use href="#cF" x="110" y="168"/><use href="#cF" x="158" y="168"/><use href="#cF" x="206" y="168"/><use href="#cF" x="254" y="168"/><use href="#cF" x="302" y="168"/>
      <g font-size="12" fill="#fff">
        <text x="18" y="14">1</text><text x="66" y="14">2</text><text x="114" y="14">3</text><text x="162" y="14">4</text><text x="210" y="14">5</text><text x="258" y="14">6</text><text x="306" y="14">7</text>
        <text x="18" y="70">8</text>
      </g>
      <g font-size="12" fill="#999">
        <text x="66" y="70">9</text><text x="114" y="70">10</text><text x="162" y="70">11</text><text x="210" y="70">12</text><text x="258" y="70">13</text><text x="306" y="70">14</text>
        <text x="18" y="126">15</text><text x="66" y="126">16</text><text x="114" y="126">17</text><text x="162" y="126">18</text><text x="210" y="126">19</text><text x="258" y="126">20</text><text x="306" y="126">21</text>
        <text x="18" y="182">22</text><text x="66" y="182">23</text><text x="114" y="182">24</text><text x="162" y="182">25</text><text x="210" y="182">26</text><text x="258" y="182">27</text><text x="306" y="182">28</text>
      </g>
    </g>
    <g id="cardsB" font-size="12" fill="#fff">
      <g transform="translate(14,0)">
        <rect x="1" y="1" width="78" height="135" fill="#222B3A" stroke="#F4C430" stroke-width="2"/>
        <text x="40" y="13" text-anchor="middle">累積 7 次</text>
        <image href="../../../art/ui/resource/coin.png" x="4" y="18" width="25" height="25"/><text x="33" y="35" font-size="11">2000</text>
        <image href="../../../art/ui/resource/silver.png" x="4" y="55" width="25" height="25"/><text x="33" y="72" font-size="11">1</text>
        <rect x="4" y="90" width="72" height="44" fill="#2ECC71"/><text x="40" y="116" text-anchor="middle" fill="#000">領取</text>
      </g>
      <g transform="translate(98,0)">
        <rect x="0.5" y="0.5" width="79" height="136" fill="#222B3A" stroke="#5D6D7E"/>
        <text x="40" y="13" text-anchor="middle">累積 14 次</text>
        <image href="../../../art/ui/resource/coin.png" x="4" y="18" width="25" height="25"/><text x="33" y="35" font-size="11">5000</text>
        <image href="../../../art/ui/resource/silver.png" x="4" y="55" width="25" height="25"/><text x="33" y="72" font-size="11">2</text>
        <rect x="4" y="90" width="72" height="44" fill="#555D6B"/><text x="40" y="116" text-anchor="middle">還差 7 次</text>
      </g>
      <g transform="translate(182,0)">
        <rect x="0.5" y="0.5" width="79" height="136" fill="#222B3A" stroke="#5D6D7E"/>
        <text x="40" y="13" text-anchor="middle">累積 21 次</text>
        <image href="../../../art/ui/resource/coin.png" x="4" y="18" width="25" height="25"/><text x="33" y="35" font-size="11">10000</text>
        <image href="../../../art/ui/resource/silver.png" x="4" y="55" width="25" height="25"/><text x="33" y="72" font-size="11">5</text>
        <rect x="4" y="90" width="72" height="44" fill="#555D6B"/><text x="40" y="116" text-anchor="middle">還差 14 次</text>
      </g>
      <g transform="translate(266,0)">
        <rect x="0.5" y="0.5" width="79" height="136" fill="#222B3A" stroke="#5D6D7E"/>
        <text x="40" y="13" text-anchor="middle">累積 28 次</text>
        <image href="../../../art/ui/resource/silver.png" x="4" y="18" width="25" height="25"/><text x="33" y="35" font-size="11">5</text>
        <image href="../../../art/ui/event/icon_random_item_36.png" x="4" y="50" width="36" height="36"/><text x="44" y="72" font-size="11">×1</text>
        <rect x="4" y="90" width="72" height="44" fill="#555D6B"/><text x="40" y="116" text-anchor="middle">還差 21 次</text>
      </g>
    </g>
  </defs>

  <rect width="1200" height="930" fill="#ECEFF1"/>
  <text x="20" y="22" font-size="16" fill="#111">基準 360×800 版面預覽(S01、S02;安全區上 24、下 16;真實圖檔,不縮放)</text>
  <rect x="20" y="32" width="14" height="10" class="band"/><text x="40" y="41" class="lbl" style="font-size:12px">橘:留白被延伸(括號為相對 640 版增加的像素)</text>
  <rect x="400" y="30" width="14" height="10" class="pan"/><text x="420" y="41" class="lbl" style="font-size:12px">青:內容面板被延伸(括號為相對 640 版增加的像素)</text>

  <!-- ===== 1. 首頁 800 ===== -->
  <text x="20" y="62" class="lbl">首頁 · 高 800(E=160)</text>
  <g transform="translate(20,70)">
    <g clip-path="url(#c800)">
      <image href="../../../art/backgrounds/home/top/bg_theme01_top.png" x="0" y="-40" width="360" height="200"/>
      <image href="../../../art/backgrounds/home/bg_theme01.png" x="0" y="160" width="360" height="640"/>
      <rect class="band" x="8" y="72" width="344" height="104"/><text class="ann" x="180" y="128">上留白 104px(+96)</text>
      <rect class="band" x="8" y="564" width="344" height="88"/><text class="ann" x="180" y="612">下留白 88px(+64)</text>
      <use href="#bar"/>
      <use href="#homeBar" y="176"/>
      <use href="#homeMap" y="236"/>
      <use href="#homeStart" y="484"/>
      <use href="#homeBottom" y="652"/>
      <use href="#banner" y="734"/>
    </g>
    <rect width="360" height="800" fill="none" stroke="#37474F"/>
  </g>

  <!-- ===== 2. 活動頁 A 800 ===== -->
  <text x="410" y="62" class="lbl">活動頁 A 列表 · 高 800(E=160)</text>
  <g transform="translate(410,70)">
    <g clip-path="url(#c800)">
      <image href="../../../art/backgrounds/home/top/bg_theme01_top.png" x="0" y="-40" width="360" height="200"/>
      <image href="../../../art/backgrounds/home/bg_theme01.png" x="0" y="160" width="360" height="640"/>
      <use href="#bar"/>
      <use href="#back"/>
      <text x="60" y="108" font-size="18" fill="#fff">活動</text>
      <text class="annc" x="352" y="112">面板 594px(+160)</text>
      <rect x="8" y="132" width="344" height="594" rx="6" fill="#000" fill-opacity="0.627"/>
      <rect class="pan" x="8" y="132" width="344" height="594"/>
      <use href="#itemCheck" x="14" y="138"/>
      <use href="#itemTopup" x="14" y="218"/>
      <use href="#itemFuture" x="14" y="298"/>
      <rect class="band" x="14" y="378" width="332" height="342"/>
      <text class="ann" x="180" y="540">未使用空間 342px</text>
      <text class="ann" x="180" y="558">(可完整顯示 7 項,現有 2 項 + 預覽示意 1 項)</text>
      <use href="#banner" y="734"/>
    </g>
    <rect width="360" height="800" fill="none" stroke="#37474F"/>
  </g>

  <!-- ===== 3. 活動頁 B 800 ===== -->
  <text x="800" y="62" class="lbl">活動頁 B 每日簽到 · 高 800(E=160)</text>
  <g transform="translate(800,70)">
    <g clip-path="url(#c800)">
      <image href="../../../art/backgrounds/home/top/bg_theme01_top.png" x="0" y="-40" width="360" height="200"/>
      <image href="../../../art/backgrounds/home/bg_theme01.png" x="0" y="160" width="360" height="640"/>
      <use href="#bar"/>
      <use href="#back"/>
      <text x="60" y="108" font-size="18" fill="#fff">每日簽到</text>
      <text class="annc" x="352" y="112">面板 594px(+160)</text>
      <rect x="8" y="132" width="344" height="594" rx="6" fill="#000" fill-opacity="0.627"/>
      <rect class="pan" x="8" y="132" width="344" height="594"/>
      <use href="#sumB" y="160"/>
      <use href="#gridB" y="266"/>
      <use href="#cardsB" y="548"/>
      <rect class="band" x="14" y="132" width="332" height="28"/><text class="ann" x="180" y="150">上 28px(+24)</text>
      <rect class="band" x="14" y="204" width="332" height="62"/><text class="ann" x="180" y="239">摘要與格子間 62px(+48)</text>
      <rect class="band" x="14" y="486" width="332" height="62"/><text class="ann" x="180" y="521">格子與累積卡間 62px(+48)</text>
      <rect class="band" x="14" y="685" width="332" height="41"/><text class="ann" x="180" y="709">下 41px(+40)</text>
      <use href="#banner" y="734"/>
    </g>
    <rect width="360" height="800" fill="none" stroke="#37474F"/>
  </g>

  <text x="20" y="900" font-size="12" fill="#111">E = 畫面高 − 上安全區 − 下安全區 − 600(800 高、安全區 24/16 時 E=160)。首頁:上留白 = round(0.6E) + 8、下留白 = E − round(0.6E) + 24(沿用 home_layout)。</text>
  <text x="20" y="918" font-size="12" fill="#111">活動頁:面板高 = 434 + E,所有多出的高度都進面板;B 的 E 依 15 / 30 / 30 / 25 分到 上、摘要↔格子、格子↔累積卡、下 四段留白。A 的「示意:未來活動」只在預覽存在。</text>
</svg>
