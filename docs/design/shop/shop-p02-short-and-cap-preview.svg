    <!-- 灰卡(沿用 D15 愛心已滿樣式:底 #555D6B、內容變暗 40%、鈕灰、文字白) -->
    <g id="hcardGray">
      <rect x="0.5" y="0.5" width="161" height="87" fill="#555D6B" stroke="#5D6D7E"/>
      <rect x="7" y="36" width="148" height="44" fill="#555D6B"/>
    </g>
