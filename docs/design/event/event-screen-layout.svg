<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="770" viewBox="0 0 1160 770" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <rect id="cS" width="44" height="52" fill="#2E7D4F"/>
    <rect id="cM" width="44" height="52" fill="#4A3030"/>
    <rect id="cF" width="44" height="52" fill="#2A2F3A"/>
    <g id="coin"><rect x="10" y="22" width="25" height="25" fill="#F4C430" stroke="#8A6D00"/><text x="22.5" y="39" font-size="10" text-anchor="middle" fill="#5A4500">金</text></g>
    <g id="card">
      <rect width="80" height="130" fill="#222B3A" stroke="#5D6D7E"/>
    </g>
    <g id="screenBase">
      <rect width="360" height="640" fill="#192331"/>
      <rect y="0" width="360" height="24" fill="#000" opacity="0.35"/>
      <rect y="624" width="360" height="16" fill="#000" opacity="0.35"/>
      <text x="180" y="16" font-size="9" fill="#AAB" text-anchor="middle">上安全區 24</text>
      <text x="180" y="636" font-size="9" fill="#AAB" text-anchor="middle">下安全區 16</text>
      <!-- D03 resource bar -->
      <rect x="8" y="28" width="344" height="44" rx="6" fill="#F4C430" opacity="0.85"/>
      <text x="180" y="55" font-size="13" text-anchor="middle" fill="#000">D03 資源列 8,28 344x44</text>
      <!-- D04 back -->
      <rect x="8" y="80" width="44" height="44" fill="#9B59B6"/>
      <text x="30" y="99" font-size="10" text-anchor="middle" fill="#fff">D04</text>
      <text x="30" y="115" font-size="12" text-anchor="middle" fill="#fff">返回</text>
      <!-- D06 panel -->
      <rect x="8" y="132" width="344" height="434" rx="6" fill="#000" opacity="0.63"/>
      <!-- D12 banner -->
      <rect x="20" y="574" width="320" height="50" fill="#95A5A6"/>
      <text x="180" y="603" font-size="13" text-anchor="middle" fill="#000">D12 banner 320x50 (20,574)</text>
    </g>
    <g id="listItem">
      <rect width="332" height="72" fill="#222B3A" stroke="#5D6D7E"/>
      <rect x="12" y="12" width="48" height="48" fill="#3A4252"/>
      <text x="312" y="43" font-size="18" text-anchor="middle" fill="#fff">&gt;</text>
    </g>
  </defs>

  <rect width="1160" height="770" fill="#ECEFF1"/>
  <text x="20" y="22" font-size="16" fill="#111">活動頁色塊稿 360x640:A 活動列表(左)、B 每日簽到(中,假設今天第 10 天、已簽 7 天)、C 首次儲值(右)</text>

  <!-- ===== Screen A: 活動列表 ===== -->
  <g transform="translate(20,40)">
    <use href="#screenBase"/>
    <text x="60" y="108" font-size="18" fill="#fff">活動</text>
    <text x="352" y="108" font-size="11" text-anchor="end" fill="#AAB">A 活動列表</text>
    <!-- D05 list items: x14, y=138+i*80, 332x72 -->
    <g transform="translate(14,138)"><use href="#listItem"/>
      <text x="72" y="32" font-size="16" fill="#fff">每日簽到</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">每日 1500 金幣 + 2 愛心</text>
    </g>
    <g transform="translate(14,218)"><use href="#listItem"/>
      <text x="72" y="32" font-size="16" fill="#fff">首次儲值</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">只有這個入口有優惠</text>
    </g>
    <g transform="translate(14,298)">
      <rect width="332" height="72" fill="#222B3A" stroke="#8A93A3" stroke-dasharray="4 3"/>
      <rect x="12" y="12" width="48" height="48" fill="#3A4252" opacity="0.6"/>
      <text x="72" y="32" font-size="16" fill="#fff">示意:未來活動</text>
      <text x="72" y="54" font-size="12" fill="#B0B8C4">只是示意,內容未設計</text>
      <text x="312" y="43" font-size="18" text-anchor="middle" fill="#fff">&gt;</text>
    </g>
    <!-- notes inside empty panel area -->
    <g font-size="11" fill="#B0B8C4">
      <text x="14" y="400">項目 332x72,間隔 8</text>
      <text x="14" y="416">第 N 項 y = 138 + (N-1) x 80</text>
      <text x="14" y="432">一頁放 5 項(y 138~530)</text>
      <text x="14" y="456">多於 5 項時:</text>
      <text x="14" y="472">第 6 項露出一部分,可上下拖動,</text>
      <text x="14" y="488">右側 4px 捲軸(x 347)才顯示</text>
      <text x="14" y="512">按下:整項變暗 40%</text>
      <text x="14" y="528">首儲已購買:圖示與文字變暗 40%,</text>
      <text x="14" y="544">副標改「已購買」,仍可點</text>
    </g>
  </g>

  <!-- ===== Screen B: 每日簽到 ===== -->
  <g transform="translate(400,40)">
    <use href="#screenBase"/>
    <text x="60" y="108" font-size="18" fill="#fff">每日簽到</text>
    <!-- D07 summary + button -->
    <rect x="14" y="136" width="232" height="44" fill="#3498DB" opacity="0.8"/>
    <text x="22" y="154" font-size="13" fill="#fff">本月已簽 7 / 28 天</text>
    <text x="22" y="172" font-size="11" fill="#fff">每日 1500 金幣 + 2 愛心</text>
    <rect x="250" y="136" width="96" height="44" fill="#2ECC71"/>
    <text x="298" y="163" font-size="14" text-anchor="middle" fill="#000">今日簽到</text>
    <!-- D08 weekday header -->
    <g font-size="11" fill="#fff" text-anchor="middle">
      <text x="36" y="197">日</text><text x="84" y="197">一</text><text x="132" y="197">二</text><text x="180" y="197">三</text><text x="228" y="197">四</text><text x="276" y="197">五</text><text x="324" y="197">六</text>
    </g>
    <!-- D09 grid : x = 14+col*48, y = 202+row*56 -->
    <g font-size="12" fill="#fff">
      <g transform="translate(14,202)"><use href="#cS"/><text x="4" y="14">1</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(62,202)"><use href="#cS"/><text x="4" y="14">2</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(110,202)"><use href="#cS"/><text x="4" y="14">3</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(158,202)"><use href="#cM"/><text x="4" y="14" fill="#999">4</text><text x="22" y="38" font-size="20" text-anchor="middle" fill="#999">×</text></g>
      <g transform="translate(206,202)"><use href="#cS"/><text x="4" y="14">5</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(254,202)"><use href="#cM"/><text x="4" y="14" fill="#999">6</text><text x="22" y="38" font-size="20" text-anchor="middle" fill="#999">×</text></g>
      <g transform="translate(302,202)"><use href="#cS"/><text x="4" y="14">7</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(14,258)"><use href="#cS"/><text x="4" y="14">8</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(62,258)"><use href="#cS"/><text x="4" y="14">9</text><text x="22" y="38" font-size="20" text-anchor="middle">✓</text></g>
      <g transform="translate(110,258)"><use href="#cF"/><rect x="1" y="1" width="42" height="50" fill="none" stroke="#F4C430" stroke-width="2"/><text x="4" y="14">10</text><use href="#coin"/></g>
      <g transform="translate(158,258)"><use href="#cF"/><text x="4" y="14" fill="#999">11</text><use href="#coin"/></g>
      <g transform="translate(206,258)"><use href="#cF"/><text x="4" y="14" fill="#999">12</text><use href="#coin"/></g>
      <g transform="translate(254,258)"><use href="#cF"/><text x="4" y="14" fill="#999">13</text><use href="#coin"/></g>
      <g transform="translate(302,258)"><use href="#cF"/><text x="4" y="14" fill="#999">14</text><use href="#coin"/></g>
      <g transform="translate(14,314)"><use href="#cF"/><text x="4" y="14" fill="#999">15</text><use href="#coin"/></g>
      <g transform="translate(62,314)"><use href="#cF"/><text x="4" y="14" fill="#999">16</text><use href="#coin"/></g>
      <g transform="translate(110,314)"><use href="#cF"/><text x="4" y="14" fill="#999">17</text><use href="#coin"/></g>
      <g transform="translate(158,314)"><use href="#cF"/><text x="4" y="14" fill="#999">18</text><use href="#coin"/></g>
      <g transform="translate(206,314)"><use href="#cF"/><text x="4" y="14" fill="#999">19</text><use href="#coin"/></g>
      <g transform="translate(254,314)"><use href="#cF"/><text x="4" y="14" fill="#999">20</text><use href="#coin"/></g>
      <g transform="translate(302,314)"><use href="#cF"/><text x="4" y="14" fill="#999">21</text><use href="#coin"/></g>
      <g transform="translate(14,370)"><use href="#cF"/><text x="4" y="14" fill="#999">22</text><use href="#coin"/></g>
      <g transform="translate(62,370)"><use href="#cF"/><text x="4" y="14" fill="#999">23</text><use href="#coin"/></g>
      <g transform="translate(110,370)"><use href="#cF"/><text x="4" y="14" fill="#999">24</text><use href="#coin"/></g>
      <g transform="translate(158,370)"><use href="#cF"/><text x="4" y="14" fill="#999">25</text><use href="#coin"/></g>
      <g transform="translate(206,370)"><use href="#cF"/><text x="4" y="14" fill="#999">26</text><use href="#coin"/></g>
      <g transform="translate(254,370)"><use href="#cF"/><text x="4" y="14" fill="#999">27</text><use href="#coin"/></g>
      <g transform="translate(302,370)"><use href="#cF"/><text x="4" y="14" fill="#999">28</text><use href="#coin"/></g>
    </g>
    <rect x="14" y="202" width="332" height="220" fill="none" stroke="#5DADE2" stroke-dasharray="3 2"/>
    <!-- D10 milestone cards: x=14+i*84, y=430 -->
    <g font-size="12" fill="#fff" text-anchor="middle">
      <g transform="translate(14,430)"><use href="#card"/>
        <text x="40" y="15">累積 7 天</text>
        <rect x="4" y="22" width="25" height="25" fill="#F4C430"/><text x="32" y="40" font-size="11" text-anchor="start">2000</text>
        <rect x="4" y="50" width="25" height="25" fill="#BDC3C7"/><text x="32" y="68" font-size="11" text-anchor="start">1</text>
        <rect x="4" y="84" width="72" height="44" fill="#2ECC71"/><text x="40" y="111" fill="#000">領取</text>
      </g>
      <g transform="translate(98,430)"><use href="#card"/>
        <text x="40" y="15">累積 14 天</text>
        <rect x="4" y="22" width="25" height="25" fill="#F4C430"/><text x="32" y="40" font-size="11" text-anchor="start">5000</text>
        <rect x="4" y="50" width="25" height="25" fill="#BDC3C7"/><text x="32" y="68" font-size="11" text-anchor="start">2</text>
        <rect x="4" y="84" width="72" height="44" fill="#555D6B"/><text x="40" y="111">還差 7 天</text>
      </g>
      <g transform="translate(182,430)"><use href="#card"/>
        <text x="40" y="15">累積 21 天</text>
        <rect x="4" y="22" width="25" height="25" fill="#F4C430"/><text x="32" y="40" font-size="11" text-anchor="start">10000</text>
        <rect x="4" y="50" width="25" height="25" fill="#BDC3C7"/><text x="32" y="68" font-size="11" text-anchor="start">5</text>
        <rect x="4" y="84" width="72" height="44" fill="#555D6B"/><text x="40" y="111">還差 14 天</text>
      </g>
      <g transform="translate(266,430)"><use href="#card"/>
        <text x="40" y="15">累積 28 天</text>
        <rect x="4" y="22" width="25" height="25" fill="#BDC3C7"/><text x="32" y="40" font-size="11" text-anchor="start">5</text>
        <rect x="4" y="50" width="25" height="25" fill="#E67E22"/><text x="32" y="68" font-size="10" text-anchor="start">道具1</text>
        <rect x="4" y="84" width="72" height="44" fill="#555D6B"/><text x="40" y="111">還差 21 天</text>
      </g>
    </g>
  </g>

  <!-- ===== Screen C: 首次儲值 ===== -->
  <g transform="translate(780,40)">
    <use href="#screenBase"/>
    <text x="60" y="108" font-size="18" fill="#fff">首次儲值</text>
    <!-- D11 -->
    <text x="180" y="160" font-size="18" text-anchor="middle" fill="#F4C430">首次儲值禮包</text>
    <g font-size="16" fill="#fff">
      <rect x="14" y="188" width="332" height="60" fill="#222B3A" stroke="#5D6D7E"/>
      <rect x="26" y="205" width="25" height="25" fill="#F1C40F"/><text x="62" y="224">300 金塊</text>
      <rect x="14" y="256" width="332" height="60" fill="#222B3A" stroke="#5D6D7E"/>
      <rect x="26" y="273" width="25" height="25" fill="#BDC3C7"/><text x="62" y="292">150 銀塊</text>
      <rect x="14" y="324" width="332" height="60" fill="#222B3A" stroke="#5D6D7E"/>
      <rect x="26" y="341" width="25" height="25" fill="#E67E22"/><text x="62" y="360">商城道具 各 1 個</text>
    </g>
    <text x="180" y="410" font-size="12" text-anchor="middle" fill="#fff">只有這個入口有優惠,從商城買是原價</text>
    <text x="180" y="428" font-size="12" text-anchor="middle" fill="#fff">限購 1 次</text>
    <rect x="72" y="476" width="216" height="56" fill="#2ECC71"/>
    <text x="180" y="510" font-size="18" text-anchor="middle" fill="#000">TWD 300 購買</text>
    <text x="180" y="552" font-size="10" text-anchor="middle" fill="#AAB">D11 內容 14,136 ~ 346,560</text>
  </g>

  <text x="20" y="708" font-size="12" fill="#111">返回:B、C 按返回(或系統返回鍵、返回手勢)回 A;A 按返回回首頁。B、C 原本的分頁列移除,返回鈕旁改放頁面標題(18px 白),內容面板位置與大小不變。</text>
  <text x="20" y="728" font-size="12" fill="#111">圖例(B):綠 = 已簽;金框 = 今天未簽;暗紅 = 漏簽(不補簽);深灰 = 未到。色塊為佔位,不是最終配色,icon 為佔位方塊。</text>
  <text x="20" y="748" font-size="12" fill="#111">座標以 360x640 畫面左上為原點;A 左上 = (20,40),B 左上 = (400,40),C 左上 = (780,40)。</text>
</svg>
