<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940">
  <title>商城 P03 道具詳情彈窗(3 格:暗殺、額外生命、額外血量,每格 360x800 基準,色塊預覽)</title>
  <style>
    .t{font-family:"Cubic 11","Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#fff;font-size:14px}
    .b{font-size:16px}
    .h18{font-size:18px}
    .s{font-size:12px;fill:#B0B8C4}
    .k{fill:#000}
    .cap{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:15px;fill:#111;font-weight:bold}
    .note{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:12px;fill:#333}
  </style>
  <defs>
    <g id="skel">
      <rect width="360" height="800" fill="#192331"/>
      <rect x="8" y="28" width="64" height="44" rx="6" fill="#000" fill-opacity="0.63"/>
      <rect x="76" y="28" width="92" height="44" rx="6" fill="#000" fill-opacity="0.63"/>
      <rect x="172" y="28" width="92" height="44" rx="6" fill="#000" fill-opacity="0.63"/>
      <rect x="268" y="28" width="84" height="44" rx="6" fill="#000" fill-opacity="0.63"/>
      <rect x="18" y="38" width="25" height="25" fill="#E74C3C"/>
      <rect x="86" y="38" width="25" height="25" fill="#F4D03F"/>
      <rect x="182" y="38" width="25" height="25" fill="#E6A817"/>
      <rect x="272" y="38" width="25" height="25" fill="#A9B2BC"/>
      <rect x="31" y="51" width="12" height="12" fill="#2ECC71"/>
      <rect x="99" y="51" width="12" height="12" fill="#2ECC71"/>
      <rect x="195" y="51" width="12" height="12" fill="#2ECC71"/>
      <text class="t s" x="48" y="54">20</text><text class="t s" x="116" y="54">12,345</text><text class="t s" x="212" y="54">300</text><text class="t s" x="302" y="54">50</text>
      <rect x="8" y="80" width="44" height="44" fill="#3A4556"/>
      <text class="t b" x="30" y="108" text-anchor="middle">&lt;</text>
      <text class="t h18" x="60" y="109">商城</text>
      <rect x="8" y="132" width="344" height="594" rx="6" fill="#000" fill-opacity="0.63"/>
      <rect x="14.5" y="138.5" width="79" height="43" fill="#222B3A" stroke="#5D6D7E"/><text class="t" x="54" y="165" text-anchor="middle">儲值</text>
      <rect x="98" y="138" width="80" height="44" fill="#F4C430"/><text class="t k" x="138" y="165" text-anchor="middle">道具</text>
      <rect x="182.5" y="138.5" width="79" height="43" fill="#222B3A" stroke="#5D6D7E"/><text class="t" x="222" y="165" text-anchor="middle">愛心金幣</text>
      <rect x="266.5" y="138.5" width="79" height="43" fill="#222B3A" stroke="#5D6D7E"/><text class="t" x="306" y="165" text-anchor="middle">免費</text>
      <rect x="334.5" y="138.5" width="11" height="11" fill="#E74C3C" stroke="#fff"/>
      <rect x="14" y="186" width="332" height="2" fill="#5D6D7E"/>
      <rect x="20" y="734" width="320" height="50" fill="#3A3F4A"/><text class="t s" x="180" y="763" text-anchor="middle">banner 320x50</text>
    </g>
    <g id="irow">
      <rect x="0.5" y="0.5" width="331" height="63" fill="#222B3A" stroke="#5D6D7E"/>
      <rect x="12" y="8" width="48" height="48" fill="#6B5B95"/>
      <rect x="156" y="8" width="80" height="48" fill="#2ECC71"/>
      <rect x="240" y="8" width="80" height="48" fill="#2ECC71"/>
    </g>
    <g id="itemsPage">
      <rect x="15" y="191" width="330" height="78" fill="#222B3A" stroke="#F4C430" stroke-width="2"/>
      <text class="t b" x="86" y="224">道具綜合禮包</text>
      <g transform="translate(14,278)"><use href="#irow"/><text class="t" x="68" y="30">額外血量</text></g>
      <g transform="translate(14,350)"><use href="#irow"/><text class="t" x="68" y="30">額外生命</text></g>
      <g transform="translate(14,422)"><use href="#irow"/><text class="t" x="68" y="30">替換</text></g>
      <g transform="translate(14,494)"><use href="#irow"/><text class="t" x="68" y="30">暗殺</text></g>
      <g transform="translate(14,566)"><use href="#irow"/><text class="t" x="68" y="30">強化塗層</text></g>
      <g transform="translate(14,638)"><use href="#irow"/><text class="t" x="68" y="30">衰弱</text></g>
    </g>
    <g id="mask"><rect width="360" height="800" fill="#000" fill-opacity="0.63"/></g>
  </defs>

  <rect width="1160" height="940" fill="#D5D9DF"/>

  <!-- ===== 格 1:暗殺(有限制標籤、2 行說明) ===== -->
  <text class="cap" x="20" y="28">1. 暗殺:有限制標籤、說明 2 行</text>
  <text class="note" x="20" y="44">D27:框 296x218,x 32、y 291;圖示格 48x48、圖示 36x36 置中(格內偏移 6,6);按鈕 y = 框內 158</text>
  <svg x="20" y="52" width="360" height="800" viewBox="0 0 360 800">
    <use href="#skel"/><use href="#itemsPage"/>
    <use href="#mask"/>
    <rect x="32.5" y="291.5" width="295" height="217" fill="#222B3A" stroke="#5D6D7E"/>
    <rect x="48.5" y="307.5" width="47" height="47" fill="none" stroke="#5D6D7E" stroke-dasharray="3 2"/><rect x="54" y="313" width="36" height="36" fill="#C0504D"/>
    <text class="t h18" x="108" y="329">暗殺</text>
    <rect x="108" y="335" width="100" height="20" fill="#F4C430"/><text class="t k" x="158" y="349" text-anchor="middle" style="font-size:12px">只有魔王關可用</text>
    <text class="t" x="48" y="383">魔王扣除 30% 最大血量,最低剩 1</text>
    <text class="t" x="48" y="405">不會觸發擊退、暈眩和經驗</text>
    <text class="t s" x="48" y="432">只在本關有效</text>
    <rect x="72.5" y="449.5" width="215" height="43" fill="#3A4556" stroke="#5D6D7E"/><text class="t" x="180" y="476" text-anchor="middle">關閉</text>
  </svg>

  <!-- ===== 格 2:額外生命(3 行說明) ===== -->
  <text class="cap" x="400" y="28">2. 額外生命:說明 3 行(最高)</text>
  <text class="note" x="400" y="44">D27:框 296x240,x 32、y 280;按鈕 y = 框內 180</text>
  <svg x="400" y="52" width="360" height="800" viewBox="0 0 360 800">
    <use href="#skel"/><use href="#itemsPage"/>
    <use href="#mask"/>
    <rect x="32.5" y="280.5" width="295" height="239" fill="#222B3A" stroke="#5D6D7E"/>
    <rect x="48.5" y="296.5" width="47" height="47" fill="none" stroke="#5D6D7E" stroke-dasharray="3 2"/><rect x="54" y="302" width="36" height="36" fill="#2ECC71"/>
    <text class="t h18" x="108" y="318">額外生命</text>
    <text class="t" x="48" y="372">擋板血量歸 0 時發動,以最大血量的</text>
    <text class="t" x="48" y="394">50% 復活,每關只能復活 1 次</text>
    <text class="t" x="48" y="416">磚塊越過警戒線時不會發動</text>
    <text class="t s" x="48" y="443">只在本關有效</text>
    <rect x="72.5" y="460.5" width="215" height="43" fill="#3A4556" stroke="#5D6D7E"/><text class="t" x="180" y="487" text-anchor="middle">關閉</text>
  </svg>

  <!-- ===== 格 3:額外血量(2 行、無標籤) ===== -->
  <text class="cap" x="780" y="28">3. 額外血量:無限制標籤、說明 2 行</text>
  <text class="note" x="780" y="44">D27:框 296x218,x 32、y 291;無標籤時名稱仍在 y 38 基線,標籤位置留空</text>
  <svg x="780" y="52" width="360" height="800" viewBox="0 0 360 800">
    <use href="#skel"/><use href="#itemsPage"/>
    <use href="#mask"/>
    <rect x="32.5" y="291.5" width="295" height="217" fill="#222B3A" stroke="#5D6D7E"/>
    <rect x="48.5" y="307.5" width="47" height="47" fill="none" stroke="#5D6D7E" stroke-dasharray="3 2"/><rect x="54" y="313" width="36" height="36" fill="#E74C3C"/>
    <text class="t h18" x="108" y="329">額外血量</text>
    <text class="t" x="48" y="383">擋板血量增加 150</text>
    <text class="t" x="48" y="405">進入關卡後立即生效</text>
    <text class="t s" x="48" y="432">只在本關有效</text>
    <rect x="72.5" y="449.5" width="215" height="43" fill="#3A4556" stroke="#5D6D7E"/><text class="t" x="180" y="476" text-anchor="middle">關閉</text>
  </svg>
</svg>
