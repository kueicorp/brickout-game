<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
  <defs>
    <pattern id="brickp" x="1060" y="168" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="20" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1640" height="1000" fill="#ffffff"/>
  <text x="80" y="28" font-size="20" font-weight="bold" fill="#111827">目前版本畫面比例概念圖(單位 px,原點在左上)</text>

  <!-- ===== 區塊 1:全畫面尺寸 ===== -->
  <text x="80" y="56" font-size="16" font-weight="bold" fill="#111827">1. 全畫面尺寸</text>
  <line x1="80" y1="88" x2="440" y2="88" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="82" x2="80" y2="94" stroke="#111827" stroke-width="1"/>
  <line x1="440" y1="82" x2="440" y2="94" stroke="#111827" stroke-width="1"/>
  <text x="260" y="78" font-size="14" text-anchor="middle" fill="#111827">寬 360(固定)</text>
  <line x1="62" y1="100" x2="62" y2="740" stroke="#111827" stroke-width="1"/>
  <line x1="56" y1="100" x2="68" y2="100" stroke="#111827" stroke-width="1"/>
  <line x1="56" y1="740" x2="68" y2="740" stroke="#111827" stroke-width="1"/>
  <text x="56" y="424" font-size="14" text-anchor="end" fill="#111827">高 640</text>
  <rect x="80" y="100" width="360" height="640" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="80" y="100" width="360" height="52" fill="#3b82f6"/>
  <rect x="80" y="152" width="20" height="588" fill="#6b7280"/>
  <rect x="420" y="152" width="20" height="588" fill="#6b7280"/>
  <text x="260" y="400" font-size="14" text-anchor="middle" fill="#111827">關卡區 寬 320</text>
  <text x="260" y="420" font-size="14" text-anchor="middle" fill="#111827">(x 20~340)</text>
  <rect x="80" y="740" width="360" height="160" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="260" y="812" font-size="14" text-anchor="middle" fill="#111827">手機可延伸到高 800</text>
  <text x="260" y="834" font-size="14" text-anchor="middle" fill="#111827">(虛線範圍,寬度固定 360)</text>
  <rect x="217.5" y="658" width="85" height="16" fill="#16a34a"/>
  <text x="260" y="888" font-size="13" text-anchor="middle" fill="#111827">高 800 時擋板與警戒線位置不變,y 574 以下為空白</text>
  <text x="260" y="920" font-size="13" text-anchor="middle" fill="#111827">磚塊區 y 68~508 與警戒線 y 508 不變</text>

  <!-- ===== 區塊 2:牆壁尺寸 ===== -->
  <text x="490" y="56" font-size="16" font-weight="bold" fill="#111827">2. 牆壁尺寸(1:1,只畫前段)</text>
  <rect x="490" y="100" width="360" height="52" fill="#3b82f6"/>
  <rect x="490" y="152" width="20" height="120" fill="#6b7280"/>
  <rect x="830" y="152" width="20" height="120" fill="#6b7280"/>
  <text x="485" y="108" font-size="12" text-anchor="end" fill="#111827">y 0</text>
  <text x="485" y="156" font-size="12" text-anchor="end" fill="#111827">y 52</text>
  <text x="670" y="190" font-size="12" text-anchor="middle" fill="#111827">上方藍色為頂部區 y 0~52</text>
  <text x="670" y="208" font-size="12" text-anchor="middle" fill="#111827">球碰到 y 52 反彈</text>
  <text x="670" y="238" font-size="12" text-anchor="middle" fill="#111827">中間為關卡區 寬 320(x 20~340)</text>
  <line x1="490" y1="290" x2="850" y2="290" stroke="#111827" stroke-width="1"/>
  <line x1="490" y1="284" x2="490" y2="296" stroke="#111827" stroke-width="1"/>
  <line x1="510" y1="284" x2="510" y2="296" stroke="#111827" stroke-width="1"/>
  <line x1="830" y1="284" x2="830" y2="296" stroke="#111827" stroke-width="1"/>
  <line x1="850" y1="284" x2="850" y2="296" stroke="#111827" stroke-width="1"/>
  <text x="490" y="314" font-size="12" text-anchor="middle" fill="#111827">x 0</text>
  <text x="514" y="330" font-size="12" text-anchor="middle" fill="#111827">x 20</text>
  <text x="826" y="330" font-size="12" text-anchor="middle" fill="#111827">x 340</text>
  <text x="850" y="314" font-size="12" text-anchor="middle" fill="#111827">x 360</text>
  <text x="490" y="356" font-size="13" text-anchor="start" fill="#111827">左牆 寬 20</text>
  <text x="850" y="356" font-size="13" text-anchor="end" fill="#111827">右牆 寬 20</text>
  <text x="490" y="378" font-size="13" fill="#111827">牆高:y 52 到畫面底(640 時為 y 52~640)</text>

  <!-- ===== 區塊 3:擋板尺寸 ===== -->
  <text x="490" y="410" font-size="16" font-weight="bold" fill="#111827">3. 擋板尺寸(圖示放大 1.1 倍)</text>
  <rect x="490" y="430" width="35.2" height="17.6" fill="#16a34a"/>
  <text x="535" y="444" font-size="13" fill="#111827">長 32 × 高 16(最小)</text>
  <rect x="490" y="475" width="93.5" height="17.6" fill="#16a34a"/>
  <text x="593" y="489" font-size="13" fill="#111827">長 85 × 高 16(預設)</text>
  <text x="490" y="512" font-size="12" fill="#111827">置中時 x 137.5~222.5;上緣 = 警戒線下方 50 px(y 558)</text>
  <rect x="490" y="530" width="352" height="17.6" fill="#16a34a"/>
  <text x="490" y="572" font-size="13" fill="#111827">長 320 × 高 16(最大)</text>
  <text x="490" y="594" font-size="12" fill="#111827">標註為實際尺寸,圖形放大 1.1 倍</text>

  <!-- ===== 區塊 4:磚塊尺寸 ===== -->
  <text x="490" y="628" font-size="16" font-weight="bold" fill="#111827">4. 磚塊尺寸(圖示放大 4 倍)</text>
  <text x="570" y="658" font-size="14" text-anchor="middle" fill="#111827">寬 40</text>
  <line x1="490" y1="668" x2="650" y2="668" stroke="#111827" stroke-width="1"/>
  <line x1="490" y1="662" x2="490" y2="674" stroke="#111827" stroke-width="1"/>
  <line x1="650" y1="662" x2="650" y2="674" stroke="#111827" stroke-width="1"/>
  <rect x="490" y="676" width="160" height="80" fill="#ef4444"/>
  <line x1="665" y1="676" x2="665" y2="756" stroke="#111827" stroke-width="1"/>
  <line x1="659" y1="676" x2="671" y2="676" stroke="#111827" stroke-width="1"/>
  <line x1="659" y1="756" x2="671" y2="756" stroke="#111827" stroke-width="1"/>
  <text x="678" y="721" font-size="14" fill="#111827">高 20</text>
  <text x="490" y="784" font-size="12" fill="#111827">實際尺寸 40 × 20;最多 22 排</text>

  <!-- ===== 區塊 5:模擬遊玩畫面 ===== -->
  <text x="1040" y="56" font-size="16" font-weight="bold" fill="#111827">5. 模擬遊玩畫面(360×640,1:1)</text>
  <rect x="1040" y="100" width="360" height="640" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="1040" y="100" width="360" height="52" fill="#3b82f6"/>
  <rect x="1040" y="152" width="20" height="588" fill="#6b7280"/>
  <rect x="1380" y="152" width="20" height="588" fill="#6b7280"/>
  <rect x="1060" y="168" width="320" height="120" fill="url(#brickp)"/>
  <rect x="1060" y="168" width="320" height="440" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1060" y1="608" x2="1380" y2="608" stroke="#dc2626" stroke-width="3"/>
  <text x="1068" y="600" font-size="13" font-weight="bold" fill="#b91c1c">警戒線 y 508</text>
  <line x1="1060" y1="658" x2="1177.5" y2="658" stroke="#111827" stroke-width="1"/>
  <text x="1066" y="676" font-size="13" fill="#111827">擋板上緣 y 558</text>
  <text x="1066" y="692" font-size="13" fill="#111827">= 警戒線下方 50 px</text>
  <circle cx="1220" cy="588" r="8" fill="#f59e0b"/>
  <rect x="1177.5" y="658" width="85" height="16" fill="#16a34a"/>
  <text x="1220" y="640" font-size="13" text-anchor="middle" fill="#111827">關卡區 寬 320(x 20~340)</text>

  <!-- 左側標註 -->
  <line x1="1022" y1="126" x2="1040" y2="126" stroke="#111827" stroke-width="1"/>
  <text x="1018" y="122" font-size="13" text-anchor="end" fill="#111827">頂部區 y 0~52</text>
  <text x="1018" y="140" font-size="13" text-anchor="end" fill="#111827">球碰到 y 52 反彈</text>
  <line x1="1022" y1="400" x2="1050" y2="400" stroke="#111827" stroke-width="1"/>
  <text x="1018" y="384" font-size="13" text-anchor="end" fill="#111827">左牆 x 0~20</text>
  <text x="1018" y="418" font-size="13" text-anchor="end" fill="#111827">寬 20</text>
  <text x="1018" y="436" font-size="13" text-anchor="end" fill="#111827">y 52 到畫面底</text>

  <!-- 區塊 5 說明 -->
  <text x="1040" y="772" font-size="13" fill="#111827">關卡中不顯示技能圖示,暫停時查看技能等級</text>

  <!-- 右側標註 -->
  <line x1="1410" y1="168" x2="1410" y2="608" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="1400" y1="168" x2="1416" y2="168" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="1400" y1="608" x2="1416" y2="608" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1426" y="330" font-size="14" fill="#111827">磚塊區 y 68~508</text>
  <text x="1426" y="350" font-size="13" fill="#111827">x 20~340,一排 8 塊</text>
  <text x="1426" y="368" font-size="13" fill="#111827">最多 22 排(圖中畫 6 排)</text>
  <line x1="1228" y1="588" x2="1420" y2="588" stroke="#111827" stroke-width="1"/>
  <text x="1426" y="584" font-size="13" fill="#111827">球 16×16</text>
  <line x1="1400" y1="630" x2="1420" y2="630" stroke="#111827" stroke-width="1"/>
  <text x="1426" y="626" font-size="13" fill="#111827">右牆 x 340~360(寬 20)</text>
  <line x1="1262.5" y1="666" x2="1420" y2="666" stroke="#111827" stroke-width="1"/>
  <text x="1426" y="660" font-size="14" fill="#111827">擋板區 y 558~574</text>
  <text x="1426" y="684" font-size="13" fill="#111827">長 85,x 137.5~222.5</text>
  <text x="1426" y="702" font-size="13" fill="#111827">高 16,上緣 = 警戒線下方 50 px</text>

  <!-- ===== 圖例 ===== -->
  <text x="80" y="954" font-size="14" font-weight="bold" fill="#111827">圖例</text>
  <rect x="140" y="941" width="16" height="16" fill="#3b82f6"/>
  <text x="164" y="954" font-size="14" fill="#111827">頂部區</text>
  <rect x="270" y="941" width="16" height="16" fill="#6b7280"/>
  <text x="294" y="954" font-size="14" fill="#111827">牆壁</text>
  <rect x="380" y="941" width="16" height="16" fill="#ef4444"/>
  <text x="404" y="954" font-size="14" fill="#111827">磚塊</text>
  <rect x="490" y="941" width="16" height="16" fill="#16a34a"/>
  <text x="514" y="954" font-size="14" fill="#111827">擋板</text>
  <circle cx="618" cy="949" r="8" fill="#f59e0b"/>
  <text x="634" y="954" font-size="14" fill="#111827">球</text>
  <line x1="950" y1="949" x2="980" y2="949" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="988" y="954" font-size="14" fill="#111827">磚塊區範圍(y 68~508)</text>
  <line x1="1220" y1="949" x2="1250" y2="949" stroke="#dc2626" stroke-width="3"/>
  <text x="1258" y="954" font-size="14" fill="#111827">警戒線(y 508)</text>
</svg>
